name: CD

on:
  workflow_run:
    workflows: ["Build, Test, Scan, Push (ECR)"] # matches CI workflow "name:"
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.14.5
  TF_DIR: ./Terraform

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout code (same commit CI built)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate AWS_ROLE_ARN secret
        run: |
          if [ -z "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "::error::AWS_ROLE_ARN secret is not set!"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt (check)
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive


      - name: Terraform init (backend is in code, uses lockfile)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false


  codedeploy-deploy:
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: ${{ needs.terraform-apply.result == 'success' }}

    steps:
      - name: Checkout code (same commit CI built)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init (backend is in code, uses lockfile)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Get infrastructure outputs
        id: get-outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          CD_APP=$(terraform output -raw codedeploy_app_name)
          CD_GROUP=$(terraform output -raw codedeploy_deployment_group_name)
          CLUSTER_NAME=$(terraform output -raw ecs_cluster_name)
          SERVICE_NAME=$(terraform output -raw ecs_service_name)
          ECR_URL=$(terraform output -raw ecr_repository_url)

          # Optional outputs (if you have them)
          CONTAINER_NAME=$(terraform output -raw container_name 2>/dev/null || echo "")
          CONTAINER_PORT=$(terraform output -raw container_port 2>/dev/null || echo "")

          echo "cd_app=$CD_APP" >> $GITHUB_OUTPUT
          echo "cd_group=$CD_GROUP" >> $GITHUB_OUTPUT
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "container_name=$CONTAINER_NAME" >> $GITHUB_OUTPUT
          echo "container_port=$CONTAINER_PORT" >> $GITHUB_OUTPUT

      - name: Determine commit SHA from CI run
        id: sha
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$COMMIT_SHA" ]; then
            echo "::error::Cannot determine commit SHA from workflow_run."
            exit 1
          fi
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Verify ECR image exists (tag = CI commit SHA)
        id: verify-image
        run: |
          NEW_IMAGE="${{ steps.get-outputs.outputs.ecr_url }}:${{ steps.sha.outputs.sha }}"
          IMAGE_REPO=$(echo "$NEW_IMAGE" | cut -d: -f1 | sed 's|.*/||')
          IMAGE_TAG=$(echo "$NEW_IMAGE" | cut -d: -f2)

          aws ecr describe-images \
            --repository-name "$IMAGE_REPO" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageTags' \
            --output json >/dev/null

          echo "image_uri=$NEW_IMAGE" >> $GITHUB_OUTPUT

      - name: Get current task definition and replace image (by container name if available)
        id: taskdef
        run: |
          CLUSTER="${{ steps.get-outputs.outputs.cluster_name }}"
          SERVICE="${{ steps.get-outputs.outputs.service_name }}"
          NEW_IMAGE="${{ steps.verify-image.outputs.image_uri }}"
          CNAME="${{ steps.get-outputs.outputs.container_name }}"

          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --output json > task-def-full.json

          if [ -n "$CNAME" ]; then
            jq --arg IMAGE "$NEW_IMAGE" --arg CNAME "$CNAME" '
              .containerDefinitions |= (map(if .name == $CNAME then .image = $IMAGE else . end))
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            ' task-def-full.json > task-definition.json
          else
            jq --arg IMAGE "$NEW_IMAGE" '
              .containerDefinitions[0].image = $IMAGE
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
            ' task-def-full.json > task-definition.json
          fi

      - name: Register new task definition
        id: register-task-def
        run: |
          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "new_task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Prepare AppSpec file (YAML)
        env:
          NEW_TASK_DEF_ARN: ${{ steps.register-task-def.outputs.new_task_def_arn }}
        run: |
          # Use TF outputs if present; otherwise defaults
          CNAME="${{ steps.get-outputs.outputs.container_name }}"
          CPORT="${{ steps.get-outputs.outputs.container_port }}"
          if [ -z "$CNAME" ]; then CNAME="url-shortener"; fi
          if [ -z "$CPORT" ]; then CPORT="8080"; fi

          printf '%s\n' \
          'version: 0.0' \
          'Resources:' \
          '  - TargetService:' \
          '      Type: AWS::ECS::Service' \
          '      Properties:' \
          '        TaskDefinition: "<TASK_DEFINITION>"' \
          '        LoadBalancerInfo:' \
          "          ContainerName: \"$CNAME\"" \
          "          ContainerPort: $CPORT" \
          '        PlatformVersion: "LATEST"' \
          > appspec-final.yml

          sed -i "s|<TASK_DEFINITION>|${NEW_TASK_DEF_ARN}|g" appspec-final.yml || true

      - name: Create CodeDeploy deployment (AppSpecContent)
        id: create-deployment
        run: |
          CONTENT=$(python -c 'import json; print(json.dumps(open("appspec-final.yml","r",encoding="utf-8").read()))')

          cat > revision.json <<EOF
          {
            "applicationName": "${{ steps.get-outputs.outputs.cd_app }}",
            "deploymentGroupName": "${{ steps.get-outputs.outputs.cd_group }}",
            "revision": {
              "revisionType": "AppSpecContent",
              "appSpecContent": { "content": $CONTENT }
            },
            "description": "Deployment triggered by GitHub Actions - Commit ${{ steps.sha.outputs.sha }}"
          }
          EOF

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --cli-input-json file://revision.json \
            --query 'deploymentId' \
            --output text)

          echo "deployment_id=$DEPLOYMENT_ID" >> $GITHUB_OUTPUT
          echo "Started deployment: $DEPLOYMENT_ID"

      - name: Wait for deployment to complete
        run: |
          aws deploy wait deployment-successful \
            --deployment-id "${{ steps.create-deployment.outputs.deployment_id }}"
          echo "Deployment successful."

      - name: Summary
        run: |
          echo "=========================================="
          echo "CD complete"
          echo "Image: ${{ steps.verify-image.outputs.image_uri }}"
          echo "New Task Def: ${{ steps.register-task-def.outputs.new_task_def_arn }}"
          echo "Deployment ID: ${{ steps.create-deployment.outputs.deployment_id }}"
          echo "=========================================="
