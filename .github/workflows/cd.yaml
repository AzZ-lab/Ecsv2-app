name: CD

on:
  workflow_run:
    workflows: ["Build, Test, Scan, Push (ECR)"]
    types: [completed]
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: 1.14.5
  TF_DIR: ./Terraform

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout (same commit CI built)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform apply (infra only; CodeDeploy owns deployments)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false


  codedeploy-bluegreen:
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: ${{ needs.terraform-apply.result == 'success' }}

    steps:
      - name: Checkout (same commit CI built)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Install jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Read Terraform outputs (deployment + ECR)
        id: tfout
        working-directory: ${{ env.TF_DIR }}
        run: |
          CD_APP=$(terraform output -raw codedeploy_app_name)
          CD_GROUP=$(terraform output -raw codedeploy_deployment_group_name)
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SERVICE=$(terraform output -raw ecs_service_name)
          ECR_URL=$(terraform output -raw ecr_repository_url)

          # Strongly recommended you add these outputs in Terraform:
          # output "container_name" { value = "app" }
          # output "container_port" { value = 8080 }
          CNAME=$(terraform output -raw container_name 2>/dev/null || echo "app")
          CPORT=$(terraform output -raw container_port 2>/dev/null || echo "8080")

          echo "cd_app=$CD_APP" >> $GITHUB_OUTPUT
          echo "cd_group=$CD_GROUP" >> $GITHUB_OUTPUT
          echo "cluster=$CLUSTER" >> $GITHUB_OUTPUT
          echo "service=$SERVICE" >> $GITHUB_OUTPUT
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "cname=$CNAME" >> $GITHUB_OUTPUT
          echo "cport=$CPORT" >> $GITHUB_OUTPUT

      - name: Compute new image URI (tag = CI commit SHA)
        id: img
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$SHA" ]; then
            echo "::error::Missing workflow_run.head_sha"
            exit 1
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "image=${{ steps.tfout.outputs.ecr_url }}:$SHA" >> $GITHUB_OUTPUT

      - name: Verify image exists in ECR
        run: |
          IMAGE="${{ steps.img.outputs.image }}"
          REPO=$(echo "$IMAGE" | cut -d: -f1 | sed 's|.*/||')
          TAG=$(echo "$IMAGE" | cut -d: -f2)
          aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" >/dev/null

      - name: Fetch current task definition & replace image (by container name)
        id: taskdef
        run: |
          CLUSTER="${{ steps.tfout.outputs.cluster }}"
          SERVICE="${{ steps.tfout.outputs.service }}"
          IMAGE="${{ steps.img.outputs.image }}"
          CNAME="${{ steps.tfout.outputs.cname }}"

          CUR_TD=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$CUR_TD" \
            --query 'taskDefinition' \
            --output json > taskdef-full.json

          jq --arg IMAGE "$IMAGE" --arg CNAME "$CNAME" '
            .containerDefinitions |= (map(if .name == $CNAME then .image = $IMAGE else . end))
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' taskdef-full.json > taskdef-new.json

      - name: Register new task definition
        id: register
        run: |
          NEW_TD=$(aws ecs register-task-definition \
            --cli-input-json file://taskdef-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "new_td=$NEW_TD" >> $GITHUB_OUTPUT

      - name: Create AppSpec for CodeDeploy (YAML)
        run: |
          cat > appspec.yml <<EOF
          version: 0.0
          Resources:
            - TargetService:
                Type: AWS::ECS::Service
                Properties:
                  TaskDefinition: "${{ steps.register.outputs.new_td }}"
                  LoadBalancerInfo:
                    ContainerName: "${{ steps.tfout.outputs.cname }}"
                    ContainerPort: ${{ steps.tfout.outputs.cport }}
                  PlatformVersion: "LATEST"
          EOF

      - name: Create CodeDeploy deployment (Blue/Green)
        id: deploy
        run: |
          CONTENT=$(python -c 'import json; print(json.dumps(open("appspec.yml","r",encoding="utf-8").read()))')

          cat > revision.json <<EOF
          {
            "applicationName": "${{ steps.tfout.outputs.cd_app }}",
            "deploymentGroupName": "${{ steps.tfout.outputs.cd_group }}",
            "revision": {
              "revisionType": "AppSpecContent",
              "appSpecContent": { "content": $CONTENT }
            },
            "description": "Blue/Green deploy - Commit ${{ steps.img.outputs.sha }}"
          }
          EOF

          DEPLOY_ID=$(aws deploy create-deployment \
            --cli-input-json file://revision.json \
            --query 'deploymentId' \
            --output text)

          echo "id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Started: $DEPLOY_ID"

      - name: Wait for deployment
        run: |
          aws deploy wait deployment-successful --deployment-id "${{ steps.deploy.outputs.id }}"
          echo "Deployment successful."

      - name: Summary
        run: |
          echo "Image: ${{ steps.img.outputs.image }}"
          echo "New TaskDef: ${{ steps.register.outputs.new_td }}"
          echo "DeploymentId: ${{ steps.deploy.outputs.id }}"
